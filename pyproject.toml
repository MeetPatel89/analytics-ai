[project]
name = "analytics-agent"
version = "0.1.0"
description = "Read-only analytics agents for local and ADLS filesystems"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "adlfs>=2024.12.0",
    "azure-identity>=1.25.1",
    "duckdb>=1.4.0",
    "fsspec>=2024.12.0",
    "openai>=2.45.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "rich>=14.0.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "analytics_agent"
module-root = ""

[project.scripts]
incident_agent = "analytics_agent.incident_response_main:main"
agent = "analytics_agent.interactive_cli:main"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "I",
    "PTH",
    "N",
    "D",
    "C4",
    "ANN"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
